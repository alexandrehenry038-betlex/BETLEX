<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>BETLEX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1020;
  color:#fff;
  min-height:100vh;
  padding-bottom:80px;
}

header{
  background:#111827;
  padding:18px 15px;
  text-align:center;
  border-bottom:1px solid #263248;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{font-size:28px;letter-spacing:2px}
header p{color:#9ca3af;margin-top:5px;font-size:13px}

.page{
  display:none;
  max-width:700px;
  margin:auto;
  padding:20px 15px;
}

.page.active{display:block}

h2{margin-bottom:15px}

.card{
  background:#151e30;
  border:1px solid #273449;
  border-radius:15px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(0,0,0,.18);
}

.card h3{margin-bottom:9px}

.muted{color:#9ca3af;font-size:13px}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:9px;
  background:#263248;
}

.cote{
  font-size:23px;
  font-weight:bold;
  margin-top:10px;
}

button{
  border:none;
  border-radius:10px;
  padding:11px 14px;
  cursor:pointer;
  font-weight:bold;
  margin-top:8px;
  background:#2563eb;
  color:white;
}

button:hover{opacity:.9}

button.danger{background:#dc2626}
button.secondary{background:#374151}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:7px;
  margin-bottom:12px;
  border-radius:9px;
  border:1px solid #344258;
  background:#0f172a;
  color:white;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

label{
  font-size:13px;
  color:#cbd5e1;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#111827;
  border-top:1px solid #263248;
  display:flex;
  justify-content:space-around;
  padding:9px 3px;
  z-index:20;
}

.nav-btn{
  background:none;
  color:#9ca3af;
  padding:5px 3px;
  margin:0;
  font-size:11px;
  flex:1;
}

.nav-btn.active{color:#60a5fa}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.admin-login{
  max-width:450px;
  margin:50px auto;
}

.hidden{display:none!important}
.center{text-align:center}
.success{color:#4ade80}
.error{color:#f87171}

.loading{
  text-align:center;
  padding:30px;
  color:#9ca3af;
}

.admin-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.admin-actions button{
  flex:1;
  min-width:100px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.stat{
  background:#151e30;
  border:1px solid #273449;
  border-radius:14px;
  padding:18px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

.chat-box{
  max-height:350px;
  overflow-y:auto;
  margin-bottom:10px;
}

.message{
  background:#1e293b;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.small{
  font-size:12px;
  color:#94a3b8;
}

hr{
  border:0;
  border-top:1px solid #293548;
  margin:15px 0;
}

.prono-card{
  position:relative;
}

.prono-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.prono-pick{
  font-size:18px;
  font-weight:bold;
  margin-top:7px;
}

.category-safe{background:#166534}
.category-semi{background:#854d0e}
.category-fun{background:#7e22ce}
.category-buteur{background:#0369a1}

.empty{
  text-align:center;
  padding:25px;
  color:#9ca3af;
}

.admin-item{
  background:#0f172a;
  border:1px solid #273449;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.admin-item-buttons{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.admin-item-buttons button{
  margin-top:0;
  flex:1;
}

.firebase-error{
  background:#451a1a;
  border:1px solid #7f1d1d;
  color:#fecaca;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

#adminApp{
  min-height:100vh;
  background:#0b1020;
}

#adminApp .page{
  min-height:100vh;
}

</style>
</head>

<body>

<header id="mainHeader">
  <h1>BETLEX</h1>
  <p>Les pronostics sportifs simplement</p>
</header>

<main id="publicApp">

<section id="pronostics" class="page active">

  <h2>🎯 Pronostics du jour</h2>

  <div id="firebaseError" class="firebase-error hidden"></div>

  <div id="publicPronostics">
    <div class="loading">
      Chargement des pronostics...
    </div>
  </div>

</section>


<section id="montante" class="page">

  <h2>📈 Calculateur Montante</h2>

  <div class="card">

    <label>Mise de départ (€)</label>

    <input
      id="montanteMise"
      type="number"
      step="0.01"
      value="10"
    >

    <label>Cote moyenne</label>

    <input
      id="montanteCote"
      type="number"
      step="0.01"
      value="1.50"
    >

    <label>Nombre de paris gagnants</label>

    <input
      id="montanteNb"
      type="number"
      value="5"
    >

    <button onclick="calculerMontante()">
      Calculer
    </button>

    <div
      id="montanteResult"
      style="margin-top:15px"
    ></div>

  </div>

</section>


<section id="bilan" class="page">

  <h2>📊 Bilan BETLEX</h2>

  <div class="stats">

    <div class="stat">

      <strong id="statTotal">0</strong>

      <span class="muted">
        Pronostics
      </span>

    </div>

    <div class="stat">

      <strong id="statCote">0.00</strong>

      <span class="muted">
        Cote moyenne
      </span>

    </div>

  </div>

  <div
    class="card"
    style="margin-top:15px"
  >

    <p class="muted">
      Le bilan est calcul
